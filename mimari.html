<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODIF-AI - Sistem Mimarisi</title>
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background-color: #000; color: white; overflow: hidden; display: flex; flex-direction: column; }
        body { background-image: url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=1920'); background-size: cover; background-position: center; background-attachment: fixed; }
        .garaj-katmani { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: -1; }
        
        /* NAVBAR (Tüm sayfalarla uyumlu - Menü Solda, Logo Sağda) */
        .ust-menu-cubugu { width: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0, 123, 255, 0.3); display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; box-sizing: border-box; position: sticky; top: 0; z-index: 900; transition: 0.3s; }
        
        /* YENİ EKLENEN MENÜ TETİKLEYİCİ STİLLERİ (SOL TARAF) */
        .menu-tetikleyici { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .hamburger-buton { font-size: 1.8rem; color: white; transition: 0.3s; }
        .menu-tetikleyici:hover .hamburger-buton { color: #00d2ff; transform: scale(1.1); }
        .menu-yazisi { font-size: 0.75rem; font-weight: 800; color: #00d2ff; letter-spacing: 1.5px; margin-top: 4px; }

        /* LOGO TIKLANABİLİR YAPILDI (SAĞ TARAF) */
        .ust-menu-sag { display: flex; align-items: center; gap: 15px; text-decoration: none; cursor: pointer; transition: 0.3s; }
        .ust-menu-sag:hover { transform: scale(1.02); }
        .ust-menu-logo { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #007bff; }
        .ust-menu-baslik { font-size: 1.6rem; font-weight: 800; letter-spacing: 3px; color: white; text-shadow: 0 2px 5px rgba(0,0,0,0.8); transition: 0.3s; }

        /* YAN MENÜ (Açılır Kapanır Kısım) */
        .yan-menu { position: fixed; top: 0; left: -320px; width: 300px; height: 100%; background: rgba(10, 10, 15, 0.95); backdrop-filter: blur(20px); border-right: 2px solid #007bff; box-shadow: 10px 0 30px rgba(0,0,0,0.8); z-index: 1000; transition: left 0.4s ease, background 0.3s; display: flex; flex-direction: column; padding-top: 80px; }
        .menu-kapat-buton { position: absolute; top: 25px; right: 25px; font-size: 2rem; color: white; cursor: pointer; transition: 0.3s; }
        .yan-menu a { color: white; text-decoration: none; font-size: 1.2rem; font-weight: 500; padding: 15px 30px; border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.3s; display: flex; align-items: center; gap: 15px; }
        .yan-menu a:hover { background: rgba(0, 123, 255, 0.2); padding-left: 40px; color: #00d2ff; border-left: 5px solid #00d2ff; }

        /* MERKEZİ YAZI ALANI */
        .merkez-konteynir {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .dev-yazi {
            font-size: 4rem; /* Kocaman font */
            font-weight: 900;
            color: #00d2ff;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 30px rgba(0, 210, 255, 0.6);
            line-height: 1.2;
            padding: 40px;
            border: 3px solid #007bff;
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        /* MOBİL UYUM */
        @media (max-width: 768px) {
            .dev-yazi { font-size: 2rem; padding: 20px; letter-spacing: 2px; }
            .ust-menu-baslik { font-size: 1.2rem; }
        }
        
        /* AÇIK TEMA */
        body.acik-tema .garaj-katmani { background: rgba(240, 245, 255, 0.95); }
        body.acik-tema .ust-menu-cubugu { background: rgba(255, 255, 255, 0.95); border-bottom: 2px solid #ccc; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        body.acik-tema .ust-menu-baslik, body.acik-tema .hamburger-buton, body.acik-tema .menu-kapat-buton, body.acik-tema .menu-yazisi { color: #007bff; text-shadow: none; }
        body.acik-tema .yan-menu { background: rgba(255, 255, 255, 0.98); }
        body.acik-tema .yan-menu a { color: #222; border-bottom: 1px solid #ddd; font-weight: 600; }
        body.acik-tema .dev-yazi { background: rgba(255, 255, 255, 0.9); box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-shadow: none; }
    </style>
</head>
<body>
    <script>if(localStorage.getItem("tema_gecici") === "acik") { document.body.classList.add("acik-tema"); }</script>
    <div class="garaj-katmani"></div>

    <nav class="ust-menu-cubugu">
        <div class="menu-tetikleyici" onclick="menuKontrol_dugum()">
            <i class="fas fa-bars hamburger-buton"></i>
            <span class="menu-yazisi">MENÜ</span>
        </div>
        
        <a href="index.html" class="ust-menu-sag">
            <img src="logo.jpg" alt="Logo" class="ust-menu-logo">
            <span class="ust-menu-baslik">MODIF-AI</span>
        </a>
    </nav>

    <div id="yan_menu_dugum" class="yan-menu">
        <i class="fas fa-times menu-kapat-buton" onclick="menuKontrol_dugum()"></i>
        <a href="index.html"><i class="fas fa-home"></i> Ana Sayfa</a>
        <a href="detaylar.html"><i class="fas fa-rocket"></i> Proje Detayları</a>
        <a href="tasarimlar.html"><i class="fas fa-images"></i> Örnek Tasarımlar</a>
        <a href="mimari.html"><i class="fas fa-server"></i> Sistem Mimarisi</a>
        <a href="index.html#ekip_alani"><i class="fas fa-users"></i> Geliştirici Ekip</a>
        <a href="oneriler.html"><i class="fas fa-lightbulb"></i> Önerileriniz</a>
        <a href="cekilis.html"><i class="fas fa-gift"></i> Büyük Çekiliş</a>
        <a href="sss.html"><i class="fas fa-question-circle"></i> S.S.S.</a>
        <a href="ayarlar.html"><i class="fas fa-cog"></i> Ayarlar</a>
    </div>

    <div class="merkez-konteynir">
        <h1 class="dev-yazi">
            BURAYA TEKNİK DETAYLAR YAZILACAK HOJULAR!
        </h1>
    </div>

    <script>
        function menuKontrol_dugum() {
            let dugum = document.getElementById("yan_menu_dugum");
            dugum.style.left = (dugum.style.left === "0px") ? "-320px" : "0px";
        }
    </script>
</body>
</html>
