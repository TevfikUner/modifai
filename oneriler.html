<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODIF-AI - Önerileriniz</title>
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background-color: #000; color: white; overflow-x: hidden; transition: 0.3s; letter-spacing: 0.5px; }
        body { background-image: url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=1920'); background-size: cover; background-position: center; background-attachment: fixed; }
        .garaj-katmani { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: -1; transition: 0.3s; }
        
        /* NAVBAR (YENİ TASARIM: Menü Solda, Logo Sağda) */
        .ust-menu-cubugu { width: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0, 123, 255, 0.3); display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; box-sizing: border-box; position: sticky; top: 0; z-index: 900; transition: 0.3s; }
        
        /* YENİ EKLENEN MENÜ TETİKLEYİCİ STİLLERİ (SOL TARAF) */
        .menu-tetikleyici { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .hamburger-buton { font-size: 1.8rem; color: white; transition: 0.3s; }
        .menu-tetikleyici:hover .hamburger-buton { color: #00d2ff; transform: scale(1.1); }
        .menu-yazisi { font-size: 0.75rem; font-weight: 800; color: #00d2ff; letter-spacing: 1.5px; margin-top: 4px; }

        /* LOGO TIKLANABİLİR YAPILDI (SAĞ TARAF) */
        .ust-menu-sag { display: flex; align-items: center; gap: 15px; text-decoration: none; cursor: pointer; transition: 0.3s; }
        .ust-menu-sag:hover { transform: scale(1.02); }
        .ust-menu-logo { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #007bff; }
        .ust-menu-baslik { font-size: 1.6rem; font-weight: 800; letter-spacing: 3px; color: white; text-shadow: 0 2px 5px rgba(0,0,0,0.8); transition: 0.3s; }

        /* YAN MENÜ */
        .yan-menu { position: fixed; top: 0; left: -320px; width: 300px; height: 100%; background: rgba(10, 10, 15, 0.95); backdrop-filter: blur(20px); border-right: 2px solid #007bff; box-shadow: 10px 0 30px rgba(0,0,0,0.8); z-index: 1000; transition: left 0.4s ease, background 0.3s; display: flex; flex-direction: column; padding-top: 80px; }
        .menu-kapat-buton { position: absolute; top: 25px; right: 25px; font-size: 2rem; color: white; cursor: pointer; }
        .yan-menu a { color: white; text-decoration: none; font-size: 1.2rem; font-weight: 500; padding: 15px 30px; border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.3s; display: flex; align-items: center; gap: 15px; }
        .yan-menu a:hover { background: rgba(0, 123, 255, 0.2); padding-left: 40px; color: #00d2ff; border-left: 5px solid #00d2ff; }

        /* FORM ALANI */
        .form-konteynir { display: flex; flex-direction: column; align-items: center; margin-top: 50px; padding: 20px; }
        .form-kutusu { background: rgba(0, 0, 0, 0.5); padding: 40px; border-radius: 20px; border: 1px solid rgba(0, 123, 255, 0.5); width: 100%; max-width: 500px; backdrop-filter: blur(15px); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .form-kutusu h2 { color: #00d2ff; margin-top: 0; text-align: center; font-size: 1.6rem; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.8); letter-spacing: 1px; }
        .form-kutusu p { text-align: center; color: #f0f0f0; margin-bottom: 25px; font-size: 1rem; font-weight: 500; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .girdi-alani { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.6); color: white; font-size: 1.05rem; font-weight: 500; box-sizing: border-box; font-family: inherit; }
        textarea.girdi-alani { resize: vertical; min-height: 120px; }
        .gonder-btn { background: linear-gradient(45deg, #007bff, #00d2ff); color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .gonder-btn:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(0,123,255,0.6); }
        #sonuc_dugum { text-align: center; margin-top: 15px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

        /* AÇIK TEMA */
        body.acik-tema .garaj-katmani { background: rgba(240, 245, 255, 0.95); }
        body.acik-tema .ust-menu-cubugu { background: rgba(255, 255, 255, 0.95); border-bottom: 2px solid #ccc; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        body.acik-tema .ust-menu-baslik, body.acik-tema .hamburger-buton, body.acik-tema .menu-kapat-buton, body.acik-tema .menu-yazisi { color: #007bff; text-shadow: none; }
        body.acik-tema .yan-menu { background: rgba(255, 255, 255, 0.98); }
        body.acik-tema .yan-menu a { color: #222; border-bottom: 1px solid #ddd; }
        body.acik-tema .form-kutusu { background: rgba(255, 255, 255, 0.9); border: 1px solid #ccc; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        body.acik-tema .form-kutusu h2 { text-shadow: none; }
        body.acik-tema .form-kutusu p { color: #333; text-shadow: none; }
        body.acik-tema .girdi-alani { background: #fff; color: #111; border: 1px solid #aaa; }
    </style>
</head>
<body>
    <script>
        if(localStorage.getItem("tema_gecici") === "acik") { document.body.classList.add("acik-tema"); }
    </script>

    <div class="garaj-katmani"></div>

    <nav class="ust-menu-cubugu">
        <div class="menu-tetikleyici" onclick="menuKontrol_dugum()">
            <i class="fas fa-bars hamburger-buton"></i>
            <span class="menu-yazisi">MENÜ</span>
        </div>
        
        <a href="index.html" class="ust-menu-sag">
            <img src="logo.jpg" alt="Logo" class="ust-menu-logo">
            <span class="ust-menu-baslik">MODIF-AI</span>
        </a>
    </nav>

    <div id="yan_menu_dugum" class="yan-menu">
        <i class="fas fa-times menu-kapat-buton" onclick="menuKontrol_dugum()"></i>
        <a href="index.html"><i class="fas fa-home"></i> Ana Sayfa</a>
        <a href="nasilcalisir.html"><i class="fas fa-cogs"></i> Nasıl Çalışır</a>
        <a href="tasarimlar.html"><i class="fas fa-images"></i> Örnek Tasarımlar</a>
        <a href="mimari.html"><i class="fas fa-server"></i> Sistem Mimarisi</a>
        <a href="index.html#ekip_alani"><i class="fas fa-users"></i> Geliştirici Ekip</a>
        <a href="oneriler.html"><i class="fas fa-lightbulb"></i> Önerileriniz</a>
        <a href="sss.html"><i class="fas fa-question-circle"></i> S.S.S.</a>
        <a href="ayarlar.html"><i class="fas fa-cog"></i> Ayarlar</a>
    </div>

    <div class="form-konteynir">
        <div class="form-kutusu">
            <h2>MODIF-AI İlk Olarak Hangi Özellik Gelmeli?</h2>
            <p>Sistemde görmek istediğiniz özellikleri veya önerilerinizi bizimle paylaşın.</p>
            
            <input type="text" id="isim_dugum" class="girdi-alani" placeholder="Adınız Soyadınız">
            <input type="text" id="konu_dugum" class="girdi-alani" placeholder="Konu (Örn: Jant Ekleme, Performans)">
            <textarea id="mesaj_dugum" class="girdi-alani" placeholder="Öneriniz veya Şikayetiniz..."></textarea>
            
            <button id="gonder_btn" class="gonder-btn"><i class="fas fa-paper-plane"></i> GÖNDER</button>
            <div id="sonuc_dugum"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAK-Qt0nT_zF6neKPCRyE-4vgFFW91ZadY",
            authDomain: "modifai-cekilis.firebaseapp.com",
            projectId: "modifai-cekilis",
            storageBucket: "modifai-cekilis.firebasestorage.app",
            messagingSenderId: "569243536908",
            appId: "1:569243536908:web:b263e448504ce865b3a829",
            measurementId: "G-FPEN5Q8MZS"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById("gonder_btn").addEventListener("click", async function() {
            let a = document.getElementById("isim_dugum").value;
            let b = document.getElementById("konu_dugum").value;
            let gecici = document.getElementById("mesaj_dugum").value;
            let sonuc = document.getElementById("sonuc_dugum");

            if(a !== "" && b !== "" && gecici !== "") {
                sonuc.innerText = "Gönderiliyor...";
                sonuc.style.color = "#ffcc00";
                try {
                    await addDoc(collection(db, "oneriler"), { isim: a, konu: b, mesaj: gecici, tarih: new Date() });
                    sonuc.innerText = "Öneriniz başarıyla alındı! Teşekkür ederiz.";
                    sonuc.style.color = "#00ff00";
                    document.getElementById("isim_dugum").value = ""; document.getElementById("konu_dugum").value = ""; document.getElementById("mesaj_dugum").value = "";
                } catch(e) {
                    sonuc.innerText = "Bir hata oluştu. Lütfen tekrar deneyin.";
                    sonuc.style.color = "red";
                }
            } else {
                sonuc.innerText = "Lütfen tüm alanları doldurun.";
                sonuc.style.color = "red";
            }
        });

        window.menuKontrol_dugum = function() {
            let dugum = document.getElementById("yan_menu_dugum");
            dugum.style.left = (dugum.style.left === "0px") ? "-320px" : "0px";
        }
    </script>
</body>
</html>
