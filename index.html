<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modif AI - Ekibimiz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background-color: #000; color: white; overflow-x: hidden; }
        .bilgi-seridi { width: 100%; background-color: #007bff; color: white; text-align: center; padding: 12px 0; font-size: 1rem; font-weight: 500; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4); position: relative; z-index: 10; }
        .bilgi-seridi i { margin-right: 8px; }
        body { background-image: url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=1920'); background-size: cover; background-position: center; background-attachment: fixed; display: flex; flex-direction: column; align-items: center; }
        .garaj-katmani { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); z-index: -1; }
        header { margin-top: 40px; margin-bottom: 20px; text-align: center; }
        .baslik { font-size: 2.5rem; letter-spacing: 5px; text-shadow: 0 0 15px #007bff; border-bottom: 2px solid #007bff; padding-bottom: 10px; display: inline-block; }
        
        .cekilis-yonlendirme-btn { display: inline-block; background: linear-gradient(45deg, #007bff, #00d2ff); color: white; text-decoration: none; padding: 15px 35px; border-radius: 50px; font-size: 1.2rem; font-weight: bold; letter-spacing: 2px; box-shadow: 0 0 20px rgba(0, 123, 255, 0.6); border: 2px solid transparent; transition: all 0.3s ease; }
        .cekilis-yonlendirme-btn i { margin-right: 8px; }
        .cekilis-yonlendirme-btn:hover { transform: scale(1.1); box-shadow: 0 0 35px rgba(0, 123, 255, 0.9); border-color: white; }

        /* GERİ SAYIM TASARIMI */
        .geri-sayim-alani { margin-top: 35px; text-align: center; background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 20px; border: 1px solid rgba(0, 123, 255, 0.3); backdrop-filter: blur(10px); display: inline-block; }
        .sayac-baslik { font-size: 0.85rem; color: #ddd; letter-spacing: 3px; margin-top: 0; margin-bottom: 15px; text-transform: uppercase; }
        .sayac-merkez { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .ust-birim span { font-size: 4rem; font-weight: bold; color: #00d2ff; text-shadow: 0 0 15px rgba(0, 123, 255, 0.8); line-height: 1; display: block; }
        .ust-birim small { font-size: 0.9rem; letter-spacing: 2px; color: #aaa; }
        .alt-birimler { display: flex; gap: 25px; justify-content: center; }
        .alt-birim span { font-size: 2rem; font-weight: bold; color: #00d2ff; margin-right: 5px; }
        .alt-birim small { font-size: 0.8rem; letter-spacing: 1px; color: #aaa; text-transform: uppercase; }

        .konteynir { display: flex; justify-content: center; gap: 30px; width: 90%; max-width: 1200px; padding: 20px; }
        .kart { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 25px; padding: 40px 30px; flex: 1; text-align: center; transition: all 0.4s ease; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8); }
        .kart:hover { transform: translateY(-15px); border-color: #007bff; box-shadow: 0 0 25px rgba(0, 123, 255, 0.4); background: rgba(255, 255, 255, 0.08); }
        .profil-foto { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #007bff; margin-bottom: 20px; transition: transform 0.3s ease; }
        .profil-foto:hover { transform: scale(1.1); }
        .kart h2 { font-size: 1.8rem; margin-bottom: 30px; font-weight: 400; }
        .iletisim-baglantilari { display: flex; flex-direction: column; gap: 15px; }
        .iletisim-baglantilari a { color: #fff; text-decoration: none; background: rgba(255, 255, 255, 0.1); padding: 12px; border-radius: 12px; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid transparent; }
        .iletisim-baglantilari a:hover { background: #007bff; border-color: #fff; transform: scale(1.05); }
        @media (max-width: 900px) { .konteynir { flex-direction: column; align-items: center; } .kart { width: 100%; max-width: 350px; } }
    </style>
</head>
<body>

    <div class="bilgi-seridi">
        <i class="fas fa-info-circle"></i> Modif AI platformu geliştirme aşamasındadır. Ana sitemiz çok yakında yayında!
    </div>

    <div class="garaj-katmani"></div>

    <header>
        <h1 class="baslik">MODIF AI EKİBİ</h1>
        
        <div style="text-align: center; margin-top: 25px;">
            <a href="cekilis.html" class="cekilis-yonlendirme-btn">
                <i class="fas fa-ticket-alt"></i> ÇEKİLİŞE KATIL
            </a>
        </div>

        <div class="geri-sayim-alani" id="sayac_alani_dugum">
            <p class="sayac-baslik">Çekilişe Kalan Süre</p>
            <div class="sayac-merkez">
                <div class="ust-birim">
                    <span id="gun_dugum">0</span>
                    <small>GÜN</small>
                </div>
                <div class="alt-birimler">
                    <div class="alt-birim">
                        <span id="saat_dugum">00</span>
                        <small>SAAT</small>
                    </div>
                    <div class="alt-birim">
                        <span id="dakika_dugum">00</span>
                        <small>DAKİKA</small>
                    </div>
                    <div class="alt-birim">
                        <span id="saniye_dugum">00</span>
                        <small>SANİYE</small>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="konteynir">
        <div class="kart">
            <img src="tevfik.jpeg" alt="Tevfik Üner" class="profil-foto">

                <a href="https://github.com/TevfikUner" target="_blank"><i class="fab fa-github"></i> GitHub</a>

        <div class="kart">
            <img src="emirhan.jpeg" alt="Emirhan Kar" class="profil-foto">
            <h2>Emirhan Kar</h2>

                <a href="mailto:emirhankar5434@gmail.com"><i class="fas fa-envelope"></i> Mail</a>
                <a href="https://www.linkedin.com/in/emirhan-kar-9b9662208/" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>
                <a href="https://github.com/EmirhanKar" target="_blank"><i class="fab fa-github"></i> GitHub</a>
            </div>
        </div>

        <div class="kart">
            <img src="furkan.jpeg" alt="Furkan Genç" class="profil-foto">
            <h2>Furkan Genç</h2>
            <div class="iletisim-baglantilari">
                <a href="mailto:furkann.gencc7@gmail.com"><i class="fas fa-envelope"></i> Mail</a>
                <a href="https://www.linkedin.com/in/furkan-gen%C3%A7-9b0784228/" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>
                <a href="https://github.com/FurkanGencc" target="_blank"><i class="fab fa-github"></i> GitHub</a>
            </div>
        </div>
    </div>

    <script>
        // Hedef tarih ve saat Türkiye (+03:00) saat dilimine göre ayarlandı
        const hedefTarih = new Date("May 13, 2026 17:00:00 +0300").getTime(); 

        const sayacGecici = setInterval(function() {
            const simdi = new Date().getTime();
            const kalanZaman = hedefTarih - simdi;

            if (kalanZaman < 0) {
                clearInterval(sayacGecici);
                document.getElementById("sayac_alani_dugum").innerHTML = "<h2 style='color:#00ff00; margin:0; text-shadow: 0 0 10px #00ff00;'>ÇEKİLİŞ BAŞLADI!</h2>";
                return;
            }

            const gun = Math.floor(kalanZaman / (1000 * 60 * 60 * 24));
            const saat = Math.floor((kalanZaman % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const dakika = Math.floor((kalanZaman % (1000 * 60 * 60)) / (1000 * 60));
            const saniye = Math.floor((kalanZaman % (1000 * 60)) / 1000);

            document.getElementById("gun_dugum").innerText = gun;
            document.getElementById("saat_dugum").innerText = saat < 10 ? "0" + saat : saat;
            document.getElementById("dakika_dugum").innerText = dakika < 10 ? "0" + dakika : dakika;
            document.getElementById("saniye_dugum").innerText = saniye < 10 ? "0" + saniye : saniye;

        }, 1000); 
    </script>
</body>
</html>
