<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modif AI - Ekibimiz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background-color: #000;
            color: white;
            overflow-x: hidden;
        }
        .bilgi-seridi {
            width: 100%;
            background-color: #007bff;
            color: white;
            text-align: center;
            padding: 12px 0;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
            position: relative;
            z-index: 10;
        }
        .bilgi-seridi i { margin-right: 8px; }
        
        body {
            background-image: url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=1920');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .garaj-katmani {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: -1;
        }
        header {
            margin-top: 40px;
            margin-bottom: 40px;
            text-align: center;
        }
        .baslik {
            font-size: 2.5rem;
            letter-spacing: 5px;
            text-shadow: 0 0 15px #007bff;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
            display: inline-block;
        }
        .konteynir {
            display: flex;
            justify-content: center;
            gap: 30px;
            width: 90%;
            max-width: 1200px;
            padding: 20px;
        }
        .kart {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 40px 30px;
            flex: 1;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }
        .kart:hover {
            transform: translateY(-15px);
            border-color: #007bff;
            box-shadow: 0 0 25px rgba(0, 123, 255, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }
        .profil-foto {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #007bff;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.5);
            transition: transform 0.3s ease;
        }
        .profil-foto:hover { transform: scale(1.1); }
        .kart h2 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            font-weight: 400;
        }
        .iletisim-baglantilari {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .iletisim-baglantilari a {
            color: #fff;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 12px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid transparent;
        }
        .iletisim-baglantilari a:hover {
            background: #007bff;
            border-color: #fff;
            transform: scale(1.05);
        }
        .cekilis-yonlendirme-btn {
            display: inline-block;
            background: linear-gradient(45deg, #007bff, #00d2ff);
            color: white;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(0, 123, 255, 0.6);
            border: 2px solid transparent;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cekilis-yonlendirme-btn i { margin-right: 8px; }
        .cekilis-yonlendirme-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 35px rgba(0, 123, 255, 0.9);
            border-color: white;
        }
        @media (max-width: 900px) {
            .konteynir { flex-direction: column; align-items: center; }
            .kart { width: 100%; max-width: 350px; }
            .bilgi-seridi { font-size: 0.85rem; padding: 10px 5px; }
        }
    </style>
</head>
<body>

    <div class="bilgi-seridi">
        <i class="fas fa-info-circle"></i> Modif AI platformu geliştirme aşamasındadır. Ana sitemiz çok yakında yayında!

                <i class="fas fa-ticket-alt"></i> ÇEKİLİŞE KATIL

                <a href="https://github.com/TevfikUner" target="_blank"><i class="fab fa-github"></i> GitHub</a>
            </div>
        </div>

        <div class="kart">

            <div class="iletisim-baglantilari">
                <a href="mailto:emirhankar5434@gmail.com"><i class="fas fa-envelope"></i> Mail</a>
                <a href="https://www.linkedin.com/in/emirhan-kar-9b9662208/" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>
                <a href="https://github.com/EmirhanKar" target="_blank"><i class="fab fa-github"></i> GitHub</a>

        </div>

        <div class="kart">
            <img src="furkan.jpeg" alt="Furkan Genç" class="profil-foto">

                <a href="https://www.linkedin.com/in/furkan-gen%C3%A7-9b0784228/" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>
                <a href="https://github.com/FurkanGencc" target="_blank"><i class="fab fa-github"></i> GitHub</a>

    </div>

</body>
</html>
