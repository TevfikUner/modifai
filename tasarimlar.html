<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODIF-AI - Örnek Tasarımlar</title>
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background-color: #000; color: white; overflow-x: hidden; letter-spacing: 0.5px; }
        body { background-image: url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=1920'); background-size: cover; background-position: center; background-attachment: fixed; }
        .garaj-katmani { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: -1; }

        .ust-menu-cubugu { width: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0, 123, 255, 0.3); display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; box-sizing: border-box; position: sticky; top: 0; z-index: 900; }
        .ust-menu-sol { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .ust-menu-logo { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #007bff; }
        .ust-menu-baslik { font-size: 1.6rem; font-weight: 800; letter-spacing: 3px; color: white; }
        
        .sayfa-baslik { text-align: center; font-size: 2.8rem; font-weight: 800; letter-spacing: 5px; margin: 40px 0 10px; text-shadow: 0 2px 15px rgba(0, 123, 255, 0.8); }
        .sayfa-aciklama { text-align: center; color: #f0f0f0; margin-bottom: 30px; }

        /* DEV TASARIM ALANI */
        .tasarim-konteynir { display: flex; justify-content: center; width: 95%; max-width: 1200px; margin: 0 auto 50px; }
        .tasarim-kart { background: rgba(0, 0, 0, 0.7); border: 2px solid #007bff; border-radius: 30px; padding: 40px; width: 100%; backdrop-filter: blur(25px); box-shadow: 0 25px 60px rgba(0,0,0,1); text-align: center; }
        
        .tasarim-kart h3 { color: #00d2ff; font-size: 2.2rem; font-weight: 800; margin-bottom: 30px; letter-spacing: 2px; }
        
        /* MEDYA ALANI (BÜYÜTÜLDÜ VE SABİTLENDİ) */
        .medya-alani { 
            width: 100%; 
            height: 600px; /* Görsel alanı devasa yapıldı */
            border-radius: 25px; 
            overflow: hidden; 
            margin-bottom: 35px; 
            position: relative; 
            background: #050505;
            border: 1px solid rgba(255,255,255,0.15); 
        }
        
        .foto-2d { width: 100%; height: 100%; object-fit: contain; display: block; }
        
        /* 3D Model Başlangıçta Görünmez */
        model-viewer { 
            width: 100%; 
            height: 100%; 
            display: none; 
            --poster-color: transparent; 
        }

        .ai-buton { background: linear-gradient(45deg, #007bff, #00d2ff); color: white; border: none; padding: 20px 50px; border-radius: 100px; font-size: 1.3rem; font-weight: bold; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 15px; box-shadow: 0 10px 30px rgba(0, 123, 255, 0.5); }
        .ai-buton:hover { transform: translateY(-5px); box-shadow: 0 0 40px rgba(0, 123, 255, 0.8); }

        /* YÜKLENİYOR SİMGESİ */
        .yukleniyor { color: #00d2ff; font-weight: bold; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; }
    </style>
</head>
<body>

    <div class="garaj-katmani"></div>

    <nav class="ust-menu-cubugu">
        <a href="index.html" class="ust-menu-sol">
            <img src="logo.jpg" alt="Logo" class="ust-menu-logo">
            <span class="ust-menu-baslik">MODIF-AI</span>
        </a>
    </nav>

    <h1 class="sayfa-baslik">SANAL GARAJ</h1>
    <p class="sayfa-aciklama">Porsche 911 Carrera 4S: Fotoğraftan 3D Modellemeye</p>

    <div class="tasarim-konteynir">
        <div class="tasarim-kart">
            <h3>Porsche 911 Carrera 4S</h3>
            
            <div class="medya-alani">
                <img src="araba_ilk.jpg" alt="Porsche 2D" class="foto-2d" id="resim_a">
                
                <model-viewer id="model_a" 
                              src="araba.glb" 
                              auto-rotate 
                              camera-controls 
                              touch-action="pan-y"
                              shadow-intensity="1" 
                              exposure="1"
                              loading="eager">
                </model-viewer>
                
                <div id="loader_a" class="yukleniyor"><i class="fas fa-spinner fa-spin"></i> Model Yükleniyor...</div>
            </div>

            <button class="ai-buton" id="btn_a" onclick="modeGecis_dugum('a')">
                <i class="fas fa-magic"></i> AI ile 360° Görünüm
            </button>
        </div>
    </div>

    <script>
        function modeGecis_dugum(a) {
            let resim = document.getElementById("resim_" + a);
            let model = document.getElementById("model_a");
            let btn = document.getElementById("btn_a");
            
            if(resim.style.display !== "none") {
                // 3D'ye Geçiş
                resim.style.display = "none";
                model.style.display = "block";
                btn.innerHTML = '<i class="fas fa-undo"></i> 2D Fotoğrafa Dön';
                btn.style.background = "linear-gradient(45deg, #ff416c, #ff4b2b)";
            } else {
                // 2D'ye Dönüş
                resim.style.display = "block";
                model.style.display = "none";
                btn.innerHTML = '<i class="fas fa-magic"></i> AI ile 360° Görünüm';
                btn.style.background = "linear-gradient(45deg, #007bff, #00d2ff)";
            }
        }
    </script>
</body>
</html>
