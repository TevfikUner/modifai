<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODIF-AI - Örnek Tasarımlar</title>
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background-color: #000; color: white; overflow-x: hidden; letter-spacing: 0.5px; }
        body { background-image: url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=1920'); background-size: cover; background-position: center; background-attachment: fixed; }
        .garaj-katmani { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: -1; }

        .ust-menu-cubugu { width: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0, 123, 255, 0.3); display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; box-sizing: border-box; position: sticky; top: 0; z-index: 900; }
        .ust-menu-sol { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .ust-menu-logo { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #007bff; }
        .ust-menu-baslik { font-size: 1.3rem; font-weight: 800; letter-spacing: 2px; color: white; }

        .sayfa-baslik { text-align: center; font-size: 2.2rem; font-weight: 800; letter-spacing: 3px; margin: 30px 0 5px; text-shadow: 0 2px 15px rgba(0, 123, 255, 0.8); }
        .sayfa-aciklama { text-align: center; color: #f0f0f0; font-size: 0.95rem; margin-bottom: 25px; padding: 0 20px; }

        .tasarim-konteynir { display: flex; justify-content: center; width: 95%; max-width: 1000px; margin: 0 auto 50px; }
        .tasarim-kart { background: rgba(0, 0, 0, 0.75); border: 2px solid #007bff; border-radius: 25px; padding: 25px; width: 100%; backdrop-filter: blur(25px); box-shadow: 0 20px 50px rgba(0,0,0,1); text-align: center; }
        .tasarim-kart h3 { color: #00d2ff; font-size: 1.6rem; font-weight: 800; margin-bottom: 20px; letter-spacing: 1px; }
        
        /* MEDYA ALANI GÜNCELLEMESİ */
        .medya-alani { 
            width: 100%; 
            height: 400px; /* PC için ideal */
            border-radius: 15px; 
            overflow: hidden; 
            margin-bottom: 25px; 
            position: relative; 
            background: #000;
            border: 1px solid rgba(255,255,255,0.15); 
        }
        
        /* FOTOĞRAFIN BOŞLUKLARINI YOK EDEN SİHİR */
        #resim_a { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* Resmi kutuya tam yayar, siyah boşluk bırakmaz */
            object-position: center; 
            display: block; 
        }
        
        #model_a { width: 100%; height: 100%; display: none; background-color: transparent; }

        .ai-buton { background: linear-gradient(45deg, #007bff, #00d2ff); color: white; border: none; padding: 15px 35px; border-radius: 100px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 8px 20px rgba(0, 123, 255, 0.4); }

        /* MOBİL ÖZEL AYARLAR */
        @media (max-width: 600px) {
            .medya-alani { height: 300px; } /* Telefondan girince kutu küçülür, ekranı kaplamaz */
            .sayfa-baslik { font-size: 1.8rem; }
            .tasarim-kart { padding: 20px; }
            .tasarim-kart h3 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <script>if(localStorage.getItem("tema_gecici") === "acik") { document.body.classList.add("acik-tema"); }</script>
    <div class="garaj-katmani"></div>

    <nav class="ust-menu-cubugu">
        <a href="index.html" class="ust-menu-sol">
            <img src="logo.jpg" alt="Logo" class="ust-menu-logo">
            <span class="ust-menu-baslik">MODIF-AI</span>
        </a>
    </nav>

    <h1 class="sayfa-baslik">SANAL GARAJ</h1>
    <p class="sayfa-aciklama">Porsche 911 Carrera 4S: Yapay Zeka Dönüşümü</p>

    <div class="tasarim-konteynir">
        <div class="tasarim-kart">
            <h3>Porsche 911 Carrera 4S</h3>
            <div class="medya-alani">
                <img src="araba_ilk.jpg" alt="Porsche 2D" id="resim_a">
                <model-viewer id="model_a" src="araba.glb" auto-rotate camera-controls shadow-intensity="1" exposure="1" loading="eager"></model-viewer>
            </div>
            <button class="ai-buton" id="btn_a" onclick="modeGecis_dugum()">
                <i class="fas fa-magic"></i> AI ile 360° Görünüm
            </button>
        </div>
    </div>

    <script>
        function modeGecis_dugum() {
            let resim = document.getElementById("resim_a");
            let model = document.getElementById("model_a");
            let btn = document.getElementById("btn_a");
            if (resim.style.display !== "none") {
                resim.style.display = "none";
                model.style.display = "block";
                btn.innerHTML = '<i class="fas fa-undo"></i> Fotoğrafa Dön';
                btn.style.background = "linear-gradient(45deg, #ff416c, #ff4b2b)";
            } else {
                resim.style.display = "block";
                model.style.display = "none";
                btn.innerHTML = '<i class="fas fa-magic"></i> AI ile 360° Görünüm';
                btn.style.background = "linear-gradient(45deg, #007bff, #00d2ff)";
            }
        }
    </script>
</body>
</html>
