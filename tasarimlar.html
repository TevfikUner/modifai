<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODIF-AI - Örnek Tasarımlar</title>
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background-color: #000; color: white; overflow-x: hidden; transition: 0.3s; letter-spacing: 0.5px; }
        body { background-image: url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=1920'); background-size: cover; background-position: center; background-attachment: fixed; }
        .garaj-katmani { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: -1; }

        /* NAVBAR */
        .ust-menu-cubugu { width: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0, 123, 255, 0.3); display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; box-sizing: border-box; position: sticky; top: 0; z-index: 900; }
        .ust-menu-sol { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .ust-menu-logo { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #007bff; }
        .ust-menu-baslik { font-size: 1.6rem; font-weight: 800; letter-spacing: 3px; color: white; }
        .hamburger-buton { font-size: 1.8rem; color: white; cursor: pointer; }
        
        .yan-menu { position: fixed; top: 0; left: -320px; width: 300px; height: 100%; background: rgba(10, 10, 15, 0.95); backdrop-filter: blur(20px); border-right: 2px solid #007bff; z-index: 1000; transition: 0.4s ease; display: flex; flex-direction: column; padding-top: 80px; }
        .menu-kapat-buton { position: absolute; top: 25px; right: 25px; font-size: 2rem; color: white; cursor: pointer; }
        .yan-menu a { color: white; text-decoration: none; font-size: 1.2rem; padding: 15px 30px; border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .yan-menu a:hover { background: rgba(0, 123, 255, 0.2); color: #00d2ff; }

        .sayfa-baslik { text-align: center; font-size: 2.8rem; font-weight: 800; letter-spacing: 5px; margin: 40px 0 10px; text-shadow: 0 2px 15px rgba(0, 123, 255, 0.8); }
        .sayfa-aciklama { text-align: center; color: #f0f0f0; margin-bottom: 40px; }

        /* TASARIM ALANI BÜYÜTÜLDÜ */
        .tasarim-konteynir { display: flex; justify-content: center; width: 95%; max-width: 1400px; margin: 0 auto 50px; }
        .tasarim-kart { background: rgba(0, 0, 0, 0.6); border: 2px solid rgba(0, 123, 255, 0.5); border-radius: 25px; padding: 30px; width: 100%; max-width: 900px; backdrop-filter: blur(20px); box-shadow: 0 20px 50px rgba(0,0,0,0.9); text-align: center; }
        
        .tasarim-kart h3 { color: #00d2ff; font-size: 2rem; font-weight: 800; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 2px; }
        
        /* MEDYA ALANI BOYUTLARI ARTIRILDI */
        .medya-alani { 
            width: 100%; 
            height: 500px; /* Alanı 300px'den 500px'e çıkardım */
            border-radius: 20px; 
            overflow: hidden; 
            margin-bottom: 30px; 
            position: relative; 
            background: radial-gradient(circle, rgba(30,30,30,1) 0%, rgba(0,0,0,1) 100%);
            border: 1px solid rgba(255,255,255,0.1); 
        }
        
        .foto-2d { width: 100%; height: 100%; object-fit: contain; display: block; }
        model-viewer { width: 100%; height: 100%; display: none; --poster-color: transparent; }

        .ai-buton { background: linear-gradient(45deg, #007bff, #00d2ff); color: white; border: none; padding: 18px 40px; border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 12px; box-shadow: 0 5px 20px rgba(0, 123, 255, 0.5); }
        .ai-buton:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(0, 123, 255, 0.8); }

        /* AÇIK TEMA AYARLARI */
        body.acik-tema .garaj-katmani { background: rgba(240, 245, 255, 0.95); }
        body.acik-tema .tasarim-kart { background: rgba(255, 255, 255, 0.95); border-color: #007bff; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        body.acik-tema .tasarim-kart h3 { color: #111; }
        body.acik-tema .sayfa-baslik { color: #111; }
        body.acik-tema .sayfa-aciklama { color: #333; }
    </style>
</head>
<body>

    <div class="garaj-katmani"></div>

    <nav class="ust-menu-cubugu">
        <a href="index.html" class="ust-menu-sol">
            <img src="logo.jpg" alt="Logo" class="ust-menu-logo">
            <span class="ust-menu-baslik">MODIF-AI</span>
        </a>
        <i class="fas fa-bars hamburger-buton" onclick="menuKontrol_dugum()"></i>
    </nav>

    <div id="yan_menu_dugum" class="yan-menu">
        <i class="fas fa-times menu-kapat-buton" onclick="menuKontrol_dugum()"></i>
        <a href="index.html"><i class="fas fa-home"></i> Ana Sayfa</a>
        <a href="tasarimlar.html"><i class="fas fa-images"></i> Örnek Tasarımlar</a>
        <a href="ayarlar.html"><i class="fas fa-cog"></i> Ayarlar</a>
    </div>

    <h1 class="sayfa-baslik">SANAL GARAJ</h1>
    <p class="sayfa-aciklama">Porsche 911 Carrera 4S modelinin dönüşümünü inceleyin.</p>

    <div class="tasarim-konteynir">
        <div class="tasarim-kart">
            <h3>Porsche 911 Carrera 4S</h3>
            
            <div class="medya-alani">
                <img src="araba_ilk.jpg" alt="Porsche 2D" class="foto-2d" id="resim_a">
                
                <model-viewer id="model_a" src="araba.glb" auto-rotate camera-controls shadow-intensity="1" environment-image="neutral" exposure="1.2"></model-viewer>
            </div>

            <button class="ai-buton" id="btn_a" onclick="modeGecis_dugum('a')">
                <i class="fas fa-magic"></i> AI ile 3D Modelle
            </button>
        </div>
    </div>

    <script>
        function menuKontrol_dugum() {
            let dugum = document.getElementById("yan_menu_dugum");
            dugum.style.left = (dugum.style.left === "0px") ? "-320px" : "0px";
        }

        function modeGecis_dugum(a) {
            let resim = document.getElementById("resim_" + a);
            let model = document.getElementById("model_" + a);
            let btn = document.getElementById("btn_" + a);
            
            if(resim.style.display !== "none") {
                resim.style.display = "none";
                model.style.display = "block";
                btn.innerHTML = '<i class="fas fa-undo"></i> 2D Fotoğrafa Dön';
                btn.style.background = "linear-gradient(45deg, #ff416c, #ff4b2b)";
            } else {
                resim.style.display = "block";
                model.style.display = "none";
                btn.innerHTML = '<i class="fas fa-magic"></i> AI ile 3D Modelle';
                btn.style.background = "linear-gradient(45deg, #007bff, #00d2ff)";
            }
        }

        if(localStorage.getItem("tema_gecici") === "acik") { document.body.classList.add("acik-tema"); }
    </script>
</body>
</html>
