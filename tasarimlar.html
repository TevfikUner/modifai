<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODIF-AI - Örnek Tasarımlar</title>
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background-color: #000; color: white; overflow-x: hidden; letter-spacing: 0.5px; }
        body { background-image: url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=1920'); background-size: cover; background-position: center; background-attachment: fixed; }
        .garaj-katmani { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: -1; }

        /* KLASİK NAVBAR (Ana sayfayla uyumlu) */
        .ust-menu-cubugu { width: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0, 123, 255, 0.3); display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; box-sizing: border-box; position: sticky; top: 0; z-index: 900; transition: 0.3s; }
        .ust-menu-sol { display: flex; align-items: center; gap: 15px; text-decoration: none; cursor: pointer; }
        .ust-menu-logo { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #007bff; }
        .ust-menu-baslik { font-size: 1.6rem; font-weight: 800; letter-spacing: 3px; color: white; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
        .hamburger-buton { font-size: 1.8rem; color: white; cursor: pointer; transition: 0.3s; }

        /* YAN MENÜ (SAĞDAN AÇILAN KLASİK) */
        .yan-menu { position: fixed; top: 0; right: -320px; width: 300px; height: 100%; background: rgba(10, 10, 15, 0.95); backdrop-filter: blur(20px); border-left: 2px solid #007bff; box-shadow: -10px 0 30px rgba(0,0,0,0.8); z-index: 1000; transition: right 0.4s ease; display: flex; flex-direction: column; padding-top: 80px; }
        .menu-kapat-buton { position: absolute; top: 25px; left: 25px; font-size: 2rem; color: white; cursor: pointer; }
        .yan-menu a { color: white; text-decoration: none; font-size: 1.2rem; font-weight: 500; padding: 15px 30px; border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.3s; display: flex; align-items: center; gap: 15px; }
        .yan-menu a:hover { background: rgba(0, 123, 255, 0.2); color: #00d2ff; }

        /* SAYFA İÇERİĞİ */
        .sayfa-baslik { text-align: center; font-size: 2.2rem; font-weight: 800; letter-spacing: 3px; margin: 30px 0 5px; text-shadow: 0 2px 15px rgba(0, 123, 255, 0.8); }
        .sayfa-aciklama { text-align: center; color: #f0f0f0; font-size: 0.95rem; margin-bottom: 25px; padding: 0 20px; font-weight: 500; }

        .tasarim-konteynir { display: flex; justify-content: center; width: 95%; max-width: 1000px; margin: 0 auto 50px; }
        .tasarim-kart { background: rgba(0, 0, 0, 0.75); border: 2px solid #007bff; border-radius: 25px; padding: 25px; width: 100%; backdrop-filter: blur(25px); box-shadow: 0 20px 50px rgba(0,0,0,1); text-align: center; position: relative; }
        .tasarim-kart h3 { color: #00d2ff; font-size: 1.6rem; font-weight: 800; margin-bottom: 20px; letter-spacing: 1px; }
        
        .medya-alani { 
            width: 100%; 
            height: 400px; 
            border-radius: 15px; 
            overflow: hidden; 
            margin-bottom: 25px; 
            position: relative; 
            background: #050505;
            border: 1px solid rgba(255,255,255,0.15); 
        }
        
        #resim_a { width: 100%; height: 100%; object-fit: cover; object-position: center; display: none; } 
        #model_a { width: 100%; height: 100%; display: none; background-color: transparent; }

        /* YÜKLENİYOR EKRANI (Ortak Sınıf) */
        .yukleniyor-ekrani {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #0a0a0a; z-index: 10; transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid rgba(0, 123, 255, 0.2);
            border-top: 5px solid #00d2ff;
            border-radius: 50%;
            animation: don_dugum 1s linear infinite;
            margin-bottom: 15px;
        }
        .yukleniyor-metin { color: #f0f0f0; font-size: 1rem; font-weight: 600; text-align: center; padding: 0 20px; }

        @keyframes don_dugum { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .ai-buton { background: linear-gradient(45deg, #007bff, #00d2ff); color: white; border: none; padding: 15px 35px; border-radius: 100px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 8px 20px rgba(0, 123, 255, 0.4); }

        @media (max-width: 600px) {
            .medya-alani { height: 300px; }
            .sayfa-baslik { font-size: 1.8rem; }
            .tasarim-kart { padding: 20px; }
            .ust-menu-baslik { font-size: 1.3rem; }
            .ust-menu-logo { width: 35px; height: 35px; }
        }
    </style>
</head>
<body>
    <script>if(localStorage.getItem("tema_gecici") === "acik") { document.body.classList.add("acik-tema"); }</script>
    <div class="garaj-katmani"></div>

    <nav class="ust-menu-cubugu">
        <a href="index.html" class="ust-menu-sol">
            <img src="logo.jpg" alt="Logo" class="ust-menu-logo">
            <span class="ust-menu-baslik">MODIF-AI</span>
        </a>
        <i class="fas fa-bars hamburger-buton" onclick="menuKontrol_dugum()"></i>
    </nav>

    <div id="yan_menu_dugum" class="yan-menu">
        <i class="fas fa-times menu-kapat-buton" onclick="menuKontrol_dugum()"></i>
        <a href="index.html"><i class="fas fa-home"></i> Ana Sayfa</a>
        <a href="detaylar.html"><i class="fas fa-rocket"></i> Proje Detayları</a>
        <a href="tasarimlar.html"><i class="fas fa-images"></i> Örnek Tasarımlar</a>
        <a href="mimari.html"><i class="fas fa-server"></i> Sistem Mimarisi</a>
        <a href="oneriler.html"><i class="fas fa-lightbulb"></i> Önerileriniz</a>
        <a href="ayarlar.html"><i class="fas fa-cog"></i> Ayarlar</a>
    </div>

    <h1 class="sayfa-baslik">SANAL GARAJ</h1>
    <p class="sayfa-aciklama">Geleceğin otomobilini keşfetmek üzeresiniz.</p>

    <div class="tasarim-konteynir">
        <div class="tasarim-kart">
            <h3>Porsche 911 Carrera 4S</h3>
            <div class="medya-alani">
                
                <div id="loading_overlay_2d" class="yukleniyor-ekrani">
                    <div class="spinner"></div>
                    <div class="yukleniyor-metin">Görsel hazırlanıyor,<br>lütfen bekleyiniz...</div>
                </div>

                <img src="araba_ilk.jpg" alt="Porsche 2D" id="resim_a" onload="ilkYuklemeTamam_dugum()">
                
                <model-viewer id="model_a" src="araba.glb" auto-rotate camera-controls shadow-intensity="1" exposure="1" loading="eager">
                    <div slot="poster" class="yukleniyor-ekrani" style="display: flex;">
                        <div class="spinner"></div>
                        <div class="yukleniyor-metin">360° Model indiriliyor,<br>lütfen bekleyiniz...</div>
                    </div>
                </model-viewer>
                
            </div>
            <button class="ai-buton" id="btn_a" onclick="modeGecis_dugum()">
                <i class="fas fa-magic"></i> AI ile 360° Görünüm
            </button>
        </div>
    </div>

    <script>
        function menuKontrol_dugum() {
            let dugum = document.getElementById("yan_menu_dugum");
            dugum.style.right = (dugum.style.right === "0px") ? "-320px" : "0px";
        }

        // 2D resim yüklendiğinde loader'ı kaldırır
        function ilkYuklemeTamam_dugum() {
            const loader = document.getElementById("loading_overlay_2d");
            if(loader) {
                loader.style.opacity = "0";
                setTimeout(() => {
                    loader.style.display = "none";
                    document.getElementById("resim_a").style.display = "block";
                }, 500);
            }
        }

        function modeGecis_dugum() {
            let resim = document.getElementById("resim_a");
            let model = document.getElementById("model_a");
            let btn = document.getElementById("btn_a");
            
            if (resim.style.display !== "none") {
                // 3D Ekranına Geçiş
                resim.style.display = "none";
                model.style.display = "block";
                btn.innerHTML = '<i class="fas fa-undo"></i> Fotoğrafa Dön';
                btn.style.background = "linear-gradient(45deg, #ff416c, #ff4b2b)";
            } else {
                // 2D Ekranına Dönüş
                resim.style.display = "block";
                model.style.display = "none";
                btn.innerHTML = '<i class="fas fa-magic"></i> AI ile 360° Görünüm';
                btn.style.background = "linear-gradient(45deg, #007bff, #00d2ff)";
            }
        }
    </script>
</body>
</html>
